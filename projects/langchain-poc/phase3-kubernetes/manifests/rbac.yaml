apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-agent
  namespace: langchain-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces", "events", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "describe"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent-readonly-binding
subjects:
  - kind: ServiceAccount
    name: k8s-agent
    namespace: langchain-poc
roleRef:
  kind: ClusterRole
  name: k8s-agent-readonly
  apiGroup: rbac.authorization.k8s.io
